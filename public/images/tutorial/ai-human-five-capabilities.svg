<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
<rect width="1400" height="780" rx="28" fill="#F7F5F0"/>
<text x="72" y="82" font-family="Arial,'Noto Sans SC',sans-serif" font-size="34" font-weight="700" fill="#202A35">五种需要持续“练习”的人类能力</text>
<text x="72" y="126" font-family="Arial,'Noto Sans SC',sans-serif" font-size="19" fill="#64748B">不是拒绝 AI，而是别让关键能力因为长期不用而失去手感</text>
<g font-family="Arial,'Noto Sans SC',sans-serif">
<rect x="72" y="180" width="238" height="420" rx="20" fill="#FFFFFF" stroke="#D7D4CD" stroke-width="2"/>
<circle cx="191" cy="250" r="42" fill="#E8EEF5"/><text x="191" y="262" font-size="34" text-anchor="middle" fill="#35506A">◉</text>
<text x="191" y="330" font-size="26" font-weight="700" text-anchor="middle" fill="#26384A">注意力</text>
<text x="191" y="382" font-size="18" text-anchor="middle" fill="#526273">持续投入</text>
<text x="191" y="426" font-size="17" text-anchor="middle" fill="#64748B">别让每个空档</text><text x="191" y="454" font-size="17" text-anchor="middle" fill="#64748B">都被新信息填满</text>
<rect x="100" y="510" width="182" height="54" rx="12" fill="#E8EEF5"/><text x="191" y="544" font-size="17" font-weight="700" text-anchor="middle" fill="#35506A">留白 · 深度工作</text>
<rect x="338" y="180" width="238" height="420" rx="20" fill="#FFFFFF" stroke="#D7D4CD" stroke-width="2"/>
<circle cx="457" cy="250" r="42" fill="#F5EBDD"/><text x="457" y="262" font-size="34" text-anchor="middle" fill="#91612A">?</text>
<text x="457" y="330" font-size="26" font-weight="700" text-anchor="middle" fill="#26384A">思考力</text>
<text x="457" y="382" font-size="18" text-anchor="middle" fill="#526273">定义问题</text>
<text x="457" y="426" font-size="17" text-anchor="middle" fill="#64748B">先写自己的假设</text><text x="457" y="454" font-size="17" text-anchor="middle" fill="#64748B">再让 AI 挑战它</text>
<rect x="366" y="510" width="182" height="54" rx="12" fill="#F5EBDD"/><text x="457" y="544" font-size="17" font-weight="700" text-anchor="middle" fill="#91612A">先想 · 再问</text>
<rect x="604" y="180" width="238" height="420" rx="20" fill="#FFFFFF" stroke="#D7D4CD" stroke-width="2"/>
<circle cx="723" cy="250" r="42" fill="#F4E8E8"/><text x="723" y="262" font-size="34" text-anchor="middle" fill="#9A4B4B">✓</text>
<text x="723" y="330" font-size="26" font-weight="700" text-anchor="middle" fill="#26384A">判断力</text>
<text x="723" y="382" font-size="18" text-anchor="middle" fill="#526273">核验与取舍</text>
<text x="723" y="426" font-size="17" text-anchor="middle" fill="#64748B">追溯原始证据</text><text x="723" y="454" font-size="17" text-anchor="middle" fill="#64748B">主动寻找反例</text>
<rect x="632" y="510" width="182" height="54" rx="12" fill="#F4E8E8"/><text x="723" y="544" font-size="17" font-weight="700" text-anchor="middle" fill="#9A4B4B">查证 · 反证</text>
<rect x="870" y="180" width="238" height="420" rx="20" fill="#FFFFFF" stroke="#D7D4CD" stroke-width="2"/>
<circle cx="989" cy="250" r="42" fill="#E8F1E9"/><text x="989" y="262" font-size="34" text-anchor="middle" fill="#477552">↻</text>
<text x="989" y="330" font-size="26" font-weight="700" text-anchor="middle" fill="#26384A">学习力</text>
<text x="989" y="382" font-size="18" text-anchor="middle" fill="#526273">理解与迁移</text>
<text x="989" y="426" font-size="17" text-anchor="middle" fill="#64748B">关掉 AI 后复述</text><text x="989" y="454" font-size="17" text-anchor="middle" fill="#64748B">做一道变式题</text>
<rect x="898" y="510" width="182" height="54" rx="12" fill="#E8F1E9"/><text x="989" y="544" font-size="17" font-weight="700" text-anchor="middle" fill="#477552">回忆 · 练习</text>
<rect x="1136" y="180" width="192" height="420" rx="20" fill="#FFFFFF" stroke="#D7D4CD" stroke-width="2"/>
<circle cx="1232" cy="250" r="42" fill="#EEE9F5"/><text x="1232" y="262" font-size="34" text-anchor="middle" fill="#6F5790">✳</text>
<text x="1232" y="330" font-size="26" font-weight="700" text-anchor="middle" fill="#26384A">创造力</text>
<text x="1232" y="382" font-size="18" text-anchor="middle" fill="#526273">观察与重组</text>
<text x="1232" y="426" font-size="17" text-anchor="middle" fill="#64748B">先从真实问题</text><text x="1232" y="454" font-size="17" text-anchor="middle" fill="#64748B">长出自己的点子</text>
<rect x="1150" y="510" width="164" height="54" rx="12" fill="#EEE9F5"/><text x="1232" y="544" font-size="17" font-weight="700" text-anchor="middle" fill="#6F5790">先构思 · 再发散</text>
</g>
<rect x="72" y="650" width="1256" height="78" rx="18" fill="#253647"/>
<text x="700" y="699" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">能力不是靠“知道它重要”保留下来的，而是靠定期使用与刻意练习</text>
</svg>