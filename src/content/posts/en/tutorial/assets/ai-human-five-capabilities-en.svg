<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
<rect width="1400" height="780" rx="28" fill="#F7F5F0"/>
<text x="72" y="82" font-family="Arial,'Noto Sans SC',sans-serif" font-size="34" font-weight="700" fill="#202A35">Five human capabilities that need practice</text>
<text x="72" y="126" font-family="Arial,'Noto Sans SC',sans-serif" font-size="19" fill="#64748B">Use AI without letting important capabilities fade from disuse</text>
<g font-family="Arial,'Noto Sans SC',sans-serif">
<rect x="72" y="180" width="238" height="420" rx="20" fill="#FFFFFF" stroke="#D7D4CD" stroke-width="2"/>
<circle cx="191" cy="250" r="42" fill="#E8EEF5"/><text x="191" y="262" font-size="34" text-anchor="middle" fill="#35506A">◉</text>
<text x="191" y="330" font-size="26" font-weight="700" text-anchor="middle" fill="#26384A">Attention</text>
<text x="191" y="382" font-size="18" text-anchor="middle" fill="#526273">Sustained focus</text>
<text x="191" y="426" font-size="17" text-anchor="middle" fill="#64748B">Leave some pauses</text><text x="191" y="454" font-size="17" text-anchor="middle" fill="#64748B">free of new input</text>
<rect x="100" y="510" width="182" height="54" rx="12" fill="#E8EEF5"/><text x="191" y="544" font-size="17" font-weight="700" text-anchor="middle" fill="#35506A">Space · deep work</text>
<rect x="338" y="180" width="238" height="420" rx="20" fill="#FFFFFF" stroke="#D7D4CD" stroke-width="2"/>
<circle cx="457" cy="250" r="42" fill="#F5EBDD"/><text x="457" y="262" font-size="34" text-anchor="middle" fill="#91612A">?</text>
<text x="457" y="330" font-size="26" font-weight="700" text-anchor="middle" fill="#26384A">Thinking</text>
<text x="457" y="382" font-size="18" text-anchor="middle" fill="#526273">Define the problem</text>
<text x="457" y="426" font-size="17" text-anchor="middle" fill="#64748B">Write your hypothesis</text><text x="457" y="454" font-size="17" text-anchor="middle" fill="#64748B">then let AI challenge it</text>
<rect x="366" y="510" width="182" height="54" rx="12" fill="#F5EBDD"/><text x="457" y="544" font-size="17" font-weight="700" text-anchor="middle" fill="#91612A">Think · then ask</text>
<rect x="604" y="180" width="238" height="420" rx="20" fill="#FFFFFF" stroke="#D7D4CD" stroke-width="2"/>
<circle cx="723" cy="250" r="42" fill="#F4E8E8"/><text x="723" y="262" font-size="34" text-anchor="middle" fill="#9A4B4B">✓</text>
<text x="723" y="330" font-size="26" font-weight="700" text-anchor="middle" fill="#26384A">Judgment</text>
<text x="723" y="382" font-size="18" text-anchor="middle" fill="#526273">Verify and choose</text>
<text x="723" y="426" font-size="17" text-anchor="middle" fill="#64748B">Trace primary evidence</text><text x="723" y="454" font-size="17" text-anchor="middle" fill="#64748B">seek counterexamples</text>
<rect x="632" y="510" width="182" height="54" rx="12" fill="#F4E8E8"/><text x="723" y="544" font-size="17" font-weight="700" text-anchor="middle" fill="#9A4B4B">Verify · challenge</text>
<rect x="870" y="180" width="238" height="420" rx="20" fill="#FFFFFF" stroke="#D7D4CD" stroke-width="2"/>
<circle cx="989" cy="250" r="42" fill="#E8F1E9"/><text x="989" y="262" font-size="34" text-anchor="middle" fill="#477552">↻</text>
<text x="989" y="330" font-size="26" font-weight="700" text-anchor="middle" fill="#26384A">Learning</text>
<text x="989" y="382" font-size="18" text-anchor="middle" fill="#526273">Understand and transfer</text>
<text x="989" y="426" font-size="17" text-anchor="middle" fill="#64748B">Explain without AI</text><text x="989" y="454" font-size="17" text-anchor="middle" fill="#64748B">solve a variation</text>
<rect x="898" y="510" width="182" height="54" rx="12" fill="#E8F1E9"/><text x="989" y="544" font-size="17" font-weight="700" text-anchor="middle" fill="#477552">Recall · practice</text>
<rect x="1136" y="180" width="192" height="420" rx="20" fill="#FFFFFF" stroke="#D7D4CD" stroke-width="2"/>
<circle cx="1232" cy="250" r="42" fill="#EEE9F5"/><text x="1232" y="262" font-size="34" text-anchor="middle" fill="#6F5790">✳</text>
<text x="1232" y="330" font-size="26" font-weight="700" text-anchor="middle" fill="#26384A">Creativity</text>
<text x="1232" y="382" font-size="18" text-anchor="middle" fill="#526273">Observe and combine</text>
<text x="1232" y="426" font-size="17" text-anchor="middle" fill="#64748B">Start with real needs</text><text x="1232" y="454" font-size="17" text-anchor="middle" fill="#64748B">form your own ideas</text>
<rect x="1150" y="510" width="164" height="54" rx="12" fill="#EEE9F5"/><text x="1232" y="544" font-size="17" font-weight="700" text-anchor="middle" fill="#6F5790">Sketch · expand</text>
</g>
<rect x="72" y="650" width="1256" height="78" rx="18" fill="#253647"/>
<text x="700" y="699" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">Capabilities are maintained through regular use and deliberate practice</text>
</svg>
