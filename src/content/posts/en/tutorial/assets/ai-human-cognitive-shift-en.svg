<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" rx="28" fill="#F7F5F0"/>
<text x="72" y="82" font-family="Arial,'Noto Sans SC',sans-serif" font-size="34" font-weight="700" fill="#202A35">AI changes where thinking happens</text>
<text x="72" y="126" font-family="Arial,'Noto Sans SC',sans-serif" font-size="19" fill="#64748B">From doing every step yourself to faster generation and more deliberate verification</text>
<rect x="72" y="174" width="600" height="500" rx="22" fill="#FFFFFF" stroke="#D8D4CC" stroke-width="2"/>
<rect x="728" y="174" width="600" height="500" rx="22" fill="#FFFFFF" stroke="#D8D4CC" stroke-width="2"/>
<rect x="72" y="174" width="600" height="72" rx="22" fill="#E8EEF5"/>
<rect x="728" y="174" width="600" height="72" rx="22" fill="#E5F1EA"/>
<text x="112" y="220" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#26384A">Without generative AI</text>
<text x="768" y="220" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#24543C">With generative AI</text>
<g font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" fill="#26384A">
<rect x="126" y="282" width="492" height="54" rx="12" fill="#F2F5F8"/><text x="156" y="317">1. Define the problem</text>
<path d="M372 338 V354" stroke="#94A3B8" stroke-width="3"/><path d="M364 347 L372 357 L380 347" fill="none" stroke="#94A3B8" stroke-width="3"/>
<rect x="126" y="362" width="492" height="54" rx="12" fill="#F2F5F8"/><text x="156" y="397">2. Gather information</text>
<path d="M372 418 V434" stroke="#94A3B8" stroke-width="3"/><path d="M364 427 L372 437 L380 427" fill="none" stroke="#94A3B8" stroke-width="3"/>
<rect x="126" y="442" width="492" height="54" rx="12" fill="#F2F5F8"/><text x="156" y="477">3. Read, compare and reason</text>
<path d="M372 498 V514" stroke="#94A3B8" stroke-width="3"/><path d="M364 507 L372 517 L380 507" fill="none" stroke="#94A3B8" stroke-width="3"/>
<rect x="126" y="522" width="492" height="54" rx="12" fill="#F2F5F8"/><text x="156" y="557">4. Form a conclusion</text>
<path d="M372 578 V594" stroke="#94A3B8" stroke-width="3"/><path d="M364 587 L372 597 L380 587" fill="none" stroke="#94A3B8" stroke-width="3"/>
<rect x="126" y="602" width="492" height="42" rx="12" fill="#DDE8F2"/><text x="156" y="631" font-weight="700">5. Understand and own the result</text>
</g>
<g font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" fill="#24543C">
<rect x="782" y="282" width="492" height="54" rx="12" fill="#F1F7F3"/><text x="812" y="317">People: define goals and success</text>
<path d="M1028 338 V354" stroke="#83A992" stroke-width="3"/><path d="M1020 347 L1028 357 L1036 347" fill="none" stroke="#83A992" stroke-width="3"/>
<rect x="782" y="362" width="492" height="54" rx="12" fill="#E2F0E7"/><text x="812" y="397">AI: gather, summarize and draft</text>
<path d="M1028 418 V434" stroke="#83A992" stroke-width="3"/><path d="M1020 427 L1028 437 L1036 427" fill="none" stroke="#83A992" stroke-width="3"/>
<rect x="782" y="442" width="492" height="54" rx="12" fill="#F1F7F3"/><text x="812" y="477">People: verify, challenge and choose</text>
<path d="M1028 498 V514" stroke="#83A992" stroke-width="3"/><path d="M1020 507 L1028 517 L1036 507" fill="none" stroke="#83A992" stroke-width="3"/>
<rect x="782" y="522" width="492" height="54" rx="12" fill="#F1F7F3"/><text x="812" y="557">People: integrate and accept or reject</text>
<path d="M1028 578 V594" stroke="#83A992" stroke-width="3"/><path d="M1020 587 L1028 597 L1036 587" fill="none" stroke="#83A992" stroke-width="3"/>
<rect x="782" y="602" width="492" height="42" rx="12" fill="#CFE5D7"/><text x="812" y="631" font-weight="700">People: understand and own the result</text>
</g>
<rect x="72" y="710" width="1256" height="66" rx="16" fill="#253647"/>
<text x="700" y="752" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">The risk is skipping verification, understanding and judgment along with execution</text>
</svg>
