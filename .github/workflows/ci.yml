name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: ['/', '/awesome-architecture-blog/']
    env:
      BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_CANONICAL_SITE: ${{ vars.PUBLIC_CANONICAL_SITE }}
          PUBLIC_CANONICAL_BASE: ${{ vars.PUBLIC_CANONICAL_BASE }}
      - run: pnpm check:links
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
